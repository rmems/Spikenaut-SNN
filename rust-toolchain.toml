[toolchain]
# kinetic-signals 0.4.0 declares rust-version = "1.98.1" (edition 2024).
# nir-rs 0.4.2 and axon-encoder 0.4.0 declare 1.97.1; the pin is the highest
# MSRV among crates.io dependencies so a stale default toolchain fails at
# `rustup` resolution rather than deep inside dependency compilation.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
