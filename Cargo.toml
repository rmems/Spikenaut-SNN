[package]
name = "spikenaut-snn"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Loads the Spikenaut-SNN merged_v2 16-LIF model, builds a Neuromorphic Intermediate Representation (NIR) graph from it, and ships the live exp-025 5-column front end: LiveStimAdapter produces the analog stim vector the bank was trained on. The public TelemetryEncoder CHANNEL_MAP is a deprecated historical proposal, not that map."
repository = "https://github.com/rmems/Spikenaut-SNN"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["nir", "neuromorphic", "snn", "spiking", "lif"]
categories = ["science"]
publish = false

[features]
default = []
myelin = ["dep:myelin-accelerator"]
myelin-cuda = ["myelin", "myelin-accelerator/cuda"]
training = ["dep:plasticity-lab", "dep:neuromod06"]

# The only dependencies of this repository, all resolved from crates.io.
# Deliberately unpinned to any checkout: the lockfile must resolve
# `registry+https://github.com/rust-lang/crates.io-index` for each.
#
# nir-rs: the `hdf5` feature (`.nir` file I/O) links the system libhdf5 and is
# left off on purpose; the in-memory graph model has no native dependencies.
#
# axon-encoder: 0.5.x is experimental pre-1.0, so `"0.5"` is `>=0.5.0, <0.6.0`.
# Default features are empty; the optional `serde`, `ndarray`, and `wasm-js`
# features are left off.
#
# neuromod: 0.7.x is experimental pre-1.0, so `"0.7"` is `>=0.7.0, <0.8.0`.
# Declared from crates.io (issue #5). Host-side experiments only — they do
# not rewrite Spikenaut weights, Distill, FPGA, or training loops.
#
# kinetic-signals: same `"0.4"` bound. It is a causal temporal feature layer
# *upstream* of axon-encoder (issue #14) and does not replace it. Host-side
# preprocessing only; FPGA parity is not blocked on kinetic RTL.
#
# limbic-critic: checked TD reward shaping only. The app-level adapter copies
# its four fields into neuromod; domain reward collection stays outside.
#
# synaptic-wiring: deterministic recurrent topology experiment only. It does
# not reinterpret the shipped dense input matrix or change FPGA artifacts.
#
# corpus-ipc: typed, versioned message construction only. Default features are
# kept off explicitly; no ZMQ socket, HTTP server, or background runtime.
#
# plasticity-lab: optional host-side training/session orchestration over the
# synthetic neuromod network. It never rewrites the shipped exp-025 artifacts.
# 0.2.1 still requires neuromod ^0.6, so the training feature also names that
# 0.6 crate (as `neuromod06`) and does not pass 0.7 `SpikingNetwork` values
# into the published trainer.
#
# silicon-bridge: checked signed Q8.8 parameter encoding only. Its optional
# UART feature stays disabled; live board transport remains a separate gate.
#
# myelin-accelerator: optional Rust/CUDA compute layer for issue #73.
# Pinned `=0.2.0` from crates.io for this qualification. The `myelin` feature
# enables the CPU-safe stub (no toolkit/GPU required); `myelin-cuda` forwards
# to the published `cuda` feature for real sm_120 launches. Weighted LIF has
# no high-level wrapper in v0.2 and its raw symbols need direct `cust`
# launches, so that path is explicitly out of the CPU scope (no `cust` dep).
[dependencies]
axon-encoder = "0.5"
corpus-ipc = { version = "0.1", default-features = false }
kinetic-signals = "0.4"
limbic-critic = "0.3"
myelin-accelerator = { version = "=0.2.0", default-features = false, optional = true }
neuromod = "0.7"
# Names plasticity-lab 0.2.1's neuromod 0.6.0 pin. Not a git checkout and not
# a second host experiment; the default `neuromod` dependency is 0.7.0.
neuromod06 = { package = "neuromod", version = "0.6", optional = true }
nir-rs = "0.4.4"
plasticity-lab = { version = "0.2.1", optional = true }
silicon-bridge = { version = "0.3", default-features = false }
synaptic-wiring = "0.3"

[dev-dependencies]
tempfile = "3"
