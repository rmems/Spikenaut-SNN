[package]
name = "spikenaut-snn"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Loads the Spikenaut-SNN merged_v2 16-LIF model, builds a Neuromorphic Intermediate Representation (NIR) graph from it, and documents the live exp-025 5-column sensor map. The public TelemetryEncoder CHANNEL_MAP is a deprecated historical proposal, not that adapter."
repository = "https://github.com/rmems/Spikenaut-SNN"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["nir", "neuromorphic", "snn", "spiking", "lif"]
categories = ["science"]
publish = false

# The only dependencies of this repository, all resolved from crates.io.
# Deliberately unpinned to any checkout: the lockfile must resolve
# `registry+https://github.com/rust-lang/crates.io-index` for each.
#
# nir-rs: the `hdf5` feature (`.nir` file I/O) links the system libhdf5 and is
# left off on purpose; the in-memory graph model has no native dependencies.
#
# axon-encoder: 0.4.x is experimental pre-1.0, so `"0.4"` is `>=0.4.0, <0.5.0`.
# Default features are empty; the optional `serde` and `ndarray` features are
# left off.
#
# neuromod: 0.5.x is experimental pre-1.0, so `"0.5"` is `>=0.5.0, <0.6.0`.
# Declared from crates.io (issue #5). Host-side adapter only — it does not
# rewrite Spikenaut weights, Distill, FPGA, or training loops.
#
# kinetic-signals: same `"0.4"` bound. It is a causal temporal feature layer
# *upstream* of axon-encoder (issue #14) and does not replace it. Host-side
# preprocessing only; FPGA parity is not blocked on kinetic RTL.
[dependencies]
axon-encoder = "0.4"
kinetic-signals = "0.4"
neuromod = "0.5"
nir-rs = "0.4.3"
