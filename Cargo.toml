[package]
name = "spikenaut-snn"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Loads the Spikenaut-SNN merged_v2 16-LIF model and builds a Neuromorphic Intermediate Representation (NIR) graph from it."
repository = "https://github.com/rmems/Spikenaut-SNN"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["nir", "neuromorphic", "snn", "spiking", "lif"]
categories = ["science"]
publish = false

# The only dependency of this repository, resolved from crates.io.
# Deliberately unpinned to any checkout: the lockfile must resolve
# `registry+https://github.com/rust-lang/crates.io-index`.
#
# The `hdf5` feature (`.nir` file I/O) links the system libhdf5 and is left off
# on purpose; the in-memory graph model has no native dependencies.
[dependencies]
nir-rs = "0.4.2"
