# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Draft CodeRabbit config for rmems/Spikenaut-SNN (generated locally, not pushed).
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
  - '!**/target/**'
  path_instructions:
  - path: '{src,tests}/**/*.rs'
    instructions: 'Rust edition 2024; `rust-version = "1.98.1"`; `rust-toolchain.toml` pins 1.98.1. Do not suggest downgrading the edition or using std/language APIs newer than the pinned toolchain/MSRV. CI gate: `cargo clippy --locked --all-targets --all-features -- -D warnings`, `cargo test --locked [--all-features]`, `cargo check --locked --no-default-features`, `cargo doc --locked --no-deps --all-features`. Flag anything that would fail `cargo fmt --check` or clippy `-D warnings`. The `training` feature is optional: code must build with `--no-default-features`.'
  - path: '**/Cargo.toml'
    instructions: Cargo manifest. Call out new dependencies and feature changes, and keep `rust-version` / `edition` consistent with CI.
  - path: tools/**/*.py
    instructions: 'Python 3.11 (CI; pinned `requirements-test.txt` with hashes). CI gate: `python3 tools/verify_q88.py`, `python3 -m unittest ...`, `pytest -q tests/test_anticipation_campaign.py`. Keep code compatible with the declared Python floor. Do not add unpinned dependencies; `requirements-test.txt` uses hashes.'
  - path: tools/anticipation/**/*.jl
    instructions: Julia package code. `[compat] julia = "1.10"`; CI runs Julia 1.12.7. Do not use Base/stdlib APIs newer than the compat floor without raising it. Review for type stability in hot paths (concrete struct field types, no abstractly typed containers, no non-`const` globals, no `Any`-returning branches), avoidable allocations in inner loops, and changes to exported API.
  - path: '{dataset/merged_v2,tools/fixtures}/**'
    instructions: 'Hash-pinned artifacts: `.mem` Q8.8 images are verified by `tools/verify_q88.py` and model-bank files by raw-byte digest (LF only, see `.gitattributes`). Changes must come with the regenerating code and updated pins.'
  - path: .github/workflows/**
    instructions: GitHub Actions workflows. Keep `permissions:` least-privilege and job commands in sync with the local gates documented in the repo. Every `uses:` is pinned to a full commit SHA today; new or bumped actions must be too.
  tools:
    clippy:
      enabled: true
    ruff:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: false
