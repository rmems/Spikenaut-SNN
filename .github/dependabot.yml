# Pinning every action to a commit SHA (see the comment in ci.yml) trades one
# failure mode for another: the workflows can no longer change under us, but
# nothing moves them onto a patched release either. This file is the other half
# of that pin -- Dependabot resolves a SHA pin and rewrites both the SHA and the
# trailing `# vX.Y.Z` comment, so the comments stay true without hand-editing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly, and grouped, so this is at most one pull request a month
      # rather than one per action per patch release.
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'

  # The anticipation-python CI job installs this hash-pinned file with
  # `--require-hashes --only-binary=:all:` (NumPy, pytest and their resolved
  # dependencies). Dependabot rewrites the pins and their hashes together.
  # The top-level tools/*.py verifiers are standard library only and have
  # nothing to update.
  - package-ecosystem: pip
    directory: /tools/anticipation
    schedule:
      interval: monthly
    groups:
      anticipation-test:
        patterns:
          - '*'

# Deliberately no `cargo` ecosystem. A bot bump would open pull requests
# against `[dependencies]`, and the suite already asserts that table exactly:
# `nir_rs_resolves_from_crates_io` (tests/nir_graph.rs) requires the declared
# runtime set to be the reviewed registry crates, and the per-crate
# `*_resolves_from_crates_io*` tests pin the reviewed releases (nir-rs 0.4.4,
# plasticity-lab 0.2.1, silicon-bridge 0.3, myelin-accelerator =0.2.0). A bot
# bump would fail them -- which is the tests working -- but the fix belongs in
# a commit that also updates the README's Ecosystem table, rust-toolchain.toml
# (the pin is the highest dependency MSRV), and the reasoning behind each pin,
# not in an automated one.
