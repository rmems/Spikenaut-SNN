name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

# A newer push makes an in-flight run irrelevant; cancel it rather than pay
# for both and race two sets of results onto the same PR. `github.event_name`
# is part of the key because `workflow_dispatch` and `push` resolve to the same
# `github.ref` on a branch: without it, pushing to main would cancel a run
# somebody had just asked for by hand.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not to `@v4`, for the same reason #28 pinned
      # qodana-action: a major-version ref in `actions/*` is force-moved onto
      # every patch release: `v4` and v4.4.0 name the same commit today, while
      # v4.2.2, v4.3.0 and v4.3.1 are three earlier commits that same ref used
      # to name. So a floating ref lets the step that checks this repository
      # out change without a commit here saying so. These SHAs are what the
      # major refs pointed at on 2026-09-07; bump them deliberately.
      #
      # The trade is silent drift for silent staleness, so `.github/dependabot.yml`
      # keeps them moving -- Dependabot rewrites both the SHA and the version
      # comment, which is why the comment is exact rather than a range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins 1.98.1 with rustfmt and clippy -- the MSRV
      # kinetic-signals 0.4.0 declares (nir-rs 0.4.2 and axon-encoder 0.4.0
      # declare 1.97.1). `rustup show` installs exactly that, so CI cannot
      # drift onto a newer compiler and quietly accept code the pinned
      # toolchain would reject.
      - name: Install the pinned toolchain
        run: rustup show && rustc --version && cargo --version

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # --locked so a dependency cannot resolve to something Cargo.lock does
      # not name. Issues #8 and #9 both require crates.io resolution and the
      # suite asserts it; this keeps CI from papering over a drifted lockfile.
      - name: Test
        run: cargo test --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned rather than floating, so a new interpreter release cannot
      # change a verdict about the shipped artifacts without a commit saying
      # so. The verifier is standard library only and its syntax parses back
      # to 3.8, so this is a reproducibility choice, not a hard floor -- with
      # one exception worth recording: the oversized-JSON-integer scenario
      # relies on CPython's 4300-digit integer-string limit, which only
      # exists from 3.11. On an older interpreter that scenario still passes,
      # but by way of a different ParseError, so it would stop exercising the
      # mechanism it is named for.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Standard library only, by design -- there is nothing to install.

      # Both invocations, because the package and direct-script import paths
      # resolve differently and have broken independently of each other.
      - name: Verify the shipped Q8.8 artifacts
        run: |
          python3 tools/verify_q88.py
          python3 -m tools.verify_q88

      - name: Prove the verifier can fail
        run: |
          python3 tools/verify_q88.py --self-test
          python3 -m tools.verify_q88 --self-test

      # Only the repository's own copy is checked here. The Hugging Face card
      # is not in this checkout and fetching it would put a network call in a
      # job whose whole point is that it needs nothing installed and nothing
      # reachable. Checking that copy is a `--card` run a maintainer makes
      # before publishing; see the tool's docstring.
      - name: Check the model card carries the landed corrections
        run: |
          python3 tools/check_model_card.py
          python3 tools/check_model_card.py --self-test
