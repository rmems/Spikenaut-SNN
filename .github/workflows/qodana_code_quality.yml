name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    # One linter per configuration file, so the hybrid repository runs one leg
    # per language rather than one scan that silently covers only Python.
    name: Qodana (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    strategy:
      # A failure in one language should not hide the other language's report.
      fail-fast: false
      matrix:
        include:
          - language: python
            config: qodana.yaml
          - language: rust
            config: qodana-rust.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      # The crate arrives with #24; scanning for Rust before then would fail on
      # a repository that legitimately contains none.
      - name: Decide whether this leg has anything to scan
        id: scan
        run: |
          if [ "${{ matrix.language }}" = "rust" ] && [ ! -f Cargo.toml ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml at the repository root yet; skipping the Rust scan."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Qodana Scan'
        if: steps.scan.outputs.run == 'true'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          args: --config,${{ matrix.config }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_983296264 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
