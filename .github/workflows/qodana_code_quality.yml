name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

# A newer push makes an in-flight scan irrelevant; cancel it rather than pay
# for both and race two sets of results onto the same pull request. Mirrors
# the same block in ci.yml.
#
# `github.event_name` is part of the key because `workflow_dispatch` and `push`
# resolve to the same `github.ref` on a branch: without it, pushing to main
# would cancel a scan somebody had just asked for by hand.
concurrency:
  group: qodana-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub withholds repository secrets from Dependabot pull requests and from
  # pull requests opened off a fork, so `QODANA_TOKEN` arrives empty there
  # however it is configured on this repository. A release linter then refuses
  # to start -- qodana-python prints "Starting from version 2023.2 release
  # versions of Qodana Linters require connection to Qodana Cloud" and exits 1,
  # which reads as "this branch failed review" about a scan that never examined
  # the branch.
  #
  # This job exists because the `secrets` context is not available in an `if:`
  # expression. Presence has to be established at run time and handed to the
  # scan as a job output, which *is* available there.
  token:
    name: Qodana Cloud token
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check for a Qodana Cloud token
        id: check
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_983296264 }}
        run: |
          if [ -n "${QODANA_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No QODANA_TOKEN reached this run (Dependabot and fork pull requests do not receive repository secrets); the Python scan reports as skipped."
          fi

  # Split from the Rust leg rather than sharing a matrix, because the gate has
  # to sit on `jobs.<id>.if` and the `matrix` context is not available there.
  #
  # The gate is at job level and not on the scan step on purpose. Skipping the
  # step would leave the job green, and a green `Qodana (python)` claims a scan
  # that never ran -- trading a false failure for a false pass, which is the
  # worse of the two in a repository whose checks are meant to say only what
  # they can support. A skipped job reports as skipped.
  #
  # One caveat for whoever adds branch protection. GitHub counts a *skipped*
  # required status check as satisfied, so making `Qodana (python)` required
  # would not stop a Dependabot or fork pull request from merging without it:
  # the skip reads as a pass to the protection rule even though it still reads
  # as a skip in the UI. That is not live today -- this repository has no
  # branch protection and no rulesets (`branches/main/protection` returns 404,
  # `rulesets` returns `[]`), so nothing is required and nothing is falsely
  # satisfied. If that changes, require the `Qodana Cloud token` job instead
  # and let it fail closed, or accept the Python leg as advisory on runs that
  # cannot reach the cloud.
  qodana-python:
    name: Qodana (python)
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      - name: 'Qodana Scan'
        # Pinned to a commit SHA, not to `@v2026.1`: that ref is a *branch* in
        # JetBrains/qodana-action, not a tag, so it is force-moved on every
        # patch release and a scan could change under us without a commit here
        # saying so. This SHA is where v2026.1 pointed on 2026-08-30, which is
        # also the commit tag v2026.1.3 resolves to. Bump it deliberately.
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          # pr-mode: false analyses the whole repository, so the counts this
          # reports are whole-repo baseline totals -- not the debt a given pull
          # request introduced. A pull request that adds nothing can still show
          # a large number here. Read a delta against main, never the raw
          # count, before concluding a change made anything worse.
          pr-mode: false
          # Space-separated, not comma-separated: the action warns that
          # "Comma-separated args format is deprecated and will be removed in a
          # future version."
          args: --config qodana.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_983296264 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

  # Ungated on purpose. The Rust linter is Early Access and needs no cloud
  # connection, so it passes on pull requests where the Python leg cannot run
  # at all -- verified on #36, where `Qodana (rust)` succeeded and
  # `Qodana (python)` did not. Gating both would cost a Dependabot pull request
  # the coverage it can actually get.
  qodana-rust:
    name: Qodana (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          pr-mode: false
          args: --config qodana-rust.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_983296264 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
